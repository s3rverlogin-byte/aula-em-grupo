<!DOCTYPE html>
<html>
    <head>
        <!--link o arquivo css com esse html-->
        <link rel="stylesheet" href="main.css"/>
    </head>
    <body>
        <!--criar um texto simple na tela, o id serve como referencia para o css-->
        <h1 id="texto">pockdesck</h1>
        <!--criar uma entrada de texto simple na tela-->
        <input type="text" id="input" placeholder="buscar"/>
        <!--criar um botão simples na tela, que execulta a função input() no arquivo-->
        <button id="but" onClick="input()">buscar</button>
        <img src="imagem/poke-1.png" id="imagem"/>
        <!--link o arquivo main.js nesse html-->
        <script src="main.js"/>
    </body>
</html>
